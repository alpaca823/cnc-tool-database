name: Publish CNC website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: cnc-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://alpaca823.github.io/cnc-tool-database/
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html preview.html config.js CHANGELOG.md .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages artifact is not visible yet.');
      - uses: actions/deploy-pages@v4
        id: deployment
