name: Publish CNC website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: cnc-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://alpaca823.github.io/cnc-tool-database/
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html preview.html config.js CHANGELOG.md .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages artifact is not visible yet.');
      - name: Deploy verified Pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.runId
            });
            const artifact = result.data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
            if (!artifact) throw new Error('Verified Pages artifact is missing.');
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifact.id,
              pages_build_version: context.sha, oidc_token: idToken
            });
            const deploymentId = created.data.id || created.data.status_url?.split('/').pop() || context.sha;
            for (let attempt = 0; attempt < 36; attempt++) {
              const status = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: deploymentId
              });
              core.info('Pages deployment status: ' + status.data.status);
              if (status.data.status === 'succeed') return;
              if (/fail|error|cancel/.test(status.data.status)) throw new Error('Pages deployment failed: ' + status.data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment did not finish in time.');
